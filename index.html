
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muaz Personal Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=League+Spartan:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <section class="counter-card">

        <h1>Muaz Personal Counter</h1>

        <p class="subtitle">People entered</p>

        <h2 id="count-el">0</h2>

        <div class="button-group">
            <button id="increment-btn" onclick="increment()">
                INCREMENT
            </button>

            <button id="save-btn" onclick="save()">
                SAVE
            </button>
        </div>

        <p id="save-el">Previous entries:</p>

    </section>

    <script src="index.js"></script>

</body>
</html>
